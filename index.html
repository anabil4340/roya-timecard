<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Roya Time Card">
  <title>Roya Time Card - Kiosk Terminal</title>

  <!-- ======================================================================
       CSS STYLES
       ====================================================================== -->
  <style>
    /* Reset & Base Typography */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* Top Header Bar Styling */
    .app-header {
      width: 100%;
      max-width: 360px;
      background-color: #1e293b; /* Dark Navy Slate */
      color: #ffffff;
      padding: 16px;
      text-align: center;
      border-radius: 6px 6px 0 0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .app-header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .app-header p {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    /* Main Kiosk Container (Replicating WinForms Window look) */
    .winform-container {
      background-color: #f0f0f0;
      border: 1px solid #a0a0a0;
      border-top: none;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 360px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-radius: 0 0 6px 6px;
    }

    /* Status Notification Banner */
    .status-banner {
      height: 48px;
      border: 1px solid #707070;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 0.9rem;
      font-weight: bold;
      color: #ffffff;
      white-space: pre-line; /* Allows line breaks (\n) in status messages */
      visibility: hidden;
    }

    .status-banner.visible {
      visibility: visible;
    }

    /* PIN Masked Textbox Display */
    .pin-textbox {
      background-color: #ffffff;
      border: 2px solid #7a7a7a;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 6px;
      color: #000000;
    }

    /* Keypad Grid (3 Columns) */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    /* WinForms Native-Style Buttons */
    .wf-btn {
      background-color: #e1e1e1;
      color: #000000;
      border: 1px solid #adadad;
      height: 52px;
      font-size: 1.3rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    /* Button Click Active State */
    .wf-btn:active {
      background-color: #cee5fc;
      border-color: #0078d7;
    }

    /* Spanning Action Buttons (Clock-In / Clock-Out) */
    .wf-btn-action {
      grid-column: span 3;
      height: 50px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
    }

    .wf-btn-clockin {
      background-color: #0078d7; /* Primary Blue */
      border-color: #005a9e;
    }

    .wf-btn-clockout {
      background-color: #d13438; /* Danger Red */
      border-color: #a82326;
    }

    .wf-btn-clear {
      background-color: #cccccc;
      font-size: 0.95rem;
    }

    /* Disabled State During Network Request */
    .wf-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Top Header Banner Container -->
  <header class="app-header">
    <h1>Roya Supermarket</h1>
    <p>Employee Time Card Terminal</p>
  </header>

  <!-- Main Kiosk Form Container -->
  <div class="winform-container">
    <!-- Feedback Banner for Success/Error Notifications -->
    <div id="statusBanner" class="status-banner"></div>

    <!-- Masked PIN Input Display -->
    <div id="txtPin" class="pin-textbox"></div>

    <!-- Keypad Grid Layout -->
    <div class="keypad-grid">
      <button class="wf-btn" onclick="handleNum('1')">1</button>
      <button class="wf-btn" onclick="handleNum('2')">2</button>
      <button class="wf-btn" onclick="handleNum('3')">3</button>
      <button class="wf-btn" onclick="handleNum('4')">4</button>
      <button class="wf-btn" onclick="handleNum('5')">5</button>
      <button class="wf-btn" onclick="handleNum('6')">6</button>
      <button class="wf-btn" onclick="handleNum('7')">7</button>
      <button class="wf-btn" onclick="handleNum('8')">8</button>
      <button class="wf-btn" onclick="handleNum('9')">9</button>
      
      <!-- Clear Entire PIN -->
      <button class="wf-btn wf-btn-clear" onclick="resetPinInput()">Clear</button>
      <button class="wf-btn" onclick="handleNum('0')">0</button>
      <!-- Backspace Single Digit -->
      <button class="wf-btn wf-btn-clear" onclick="handleBackspace()">⌫</button>

      <!-- Action Submission Buttons -->
      <button id="btnIn" class="wf-btn wf-btn-action wf-btn-clockin" onclick="processPunch(true)">Clock In</button>
      <button id="btnOut" class="wf-btn wf-btn-action wf-btn-clockout" onclick="processPunch(false)">Clock Out</button>
    </div>
  </div>

  <!-- ======================================================================
       JAVASCRIPT LOGIC
       ====================================================================== -->
  <script>
    /**
     * Application Configuration Settings
     */
    const CONFIG = {
      // Google Apps Script Web App Endpoint URL
      webAppUrl: "https://script.google.com/macros/s/AKfycbwBD67lv4Vk1Y_iQAKh5ZcD0EkrVgKXiUS4M4NryMeyi5FPZZ1emCdpcekHyL0XIG4C/exec",
      
      // Shared API Key required by backend authentication
      apiSecret: "RoyaTimeCard_SuperSecretKey_2026",
      
      // Delay before converting newly entered digit into an asterisk (ms)
      maskDelayMs: 500,
      
      // Duration status banner remains visible before auto-clearing (ms)
      bannerDurationMs: 3000
    };

    // Global Input Buffers & Timer Handles
    let currentPin = "";
    let maskTimer = null;
    let resetTimer = null;

    /**
     * Handles numeric keypad inputs, enforces a 6-digit PIN cap, and manages momentary character masking.
     * @param {string} digit - The number character pressed by the user.
     */
    function handleNum(digit) {
      if (currentPin.length < 6) {
        currentPin += digit;
        updatePinDisplay(true);

        // Reset and start masking timer to cover last digit after 500ms
        clearTimeout(maskTimer);
        maskTimer = setTimeout(() => {
          updatePinDisplay(false);
        }, CONFIG.maskDelayMs);
      }
    }

    /**
     * Removes only the last entered character from the PIN buffer (Backspace functionality).
     */
    function handleBackspace() {
      if (currentPin.length > 0) {
        currentPin = currentPin.slice(0, -1);
        updatePinDisplay(false);
      }
    }

    /**
     * Updates the text display element representing the entered PIN.
     * @param {boolean} showLastDigit - If true, displays the last character in plain text while masking preceding characters.
     */
    function updatePinDisplay(showLastDigit) {
      const display = document.getElementById("txtPin");
      if (!currentPin) {
        display.textContent = "";
        return;
      }

      if (showLastDigit && currentPin.length > 0) {
        const masked = "*".repeat(currentPin.length - 1);
        const last = currentPin.slice(-1);
        display.textContent = masked + last;
      } else {
        display.textContent = "*".repeat(currentPin.length);
      }
    }

    /**
     * Clears the current PIN buffer, halts active mask timers, and updates the display.
     */
    function resetPinInput() {
      clearTimeout(maskTimer);
      currentPin = "";
      updatePinDisplay(false);
    }

    /**
     * Displays the status notification banner with a specified message and background color,
     * then schedules an automatic reset after 3 seconds.
     * @param {string} message - Text or multi-line message to display inside the banner.
     * @param {string} backgroundColor - CSS color value (hex, named, or rgb) applied to banner background.
     */
    function showStatus(message, backgroundColor) {
      const banner = document.getElementById("statusBanner");
      banner.textContent = message;
      banner.style.backgroundColor = backgroundColor;
      banner.classList.add("visible");

      // Clear existing reset timer and schedule hide action
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => {
        banner.classList.remove("visible");
        resetPinInput();
      }, CONFIG.bannerDurationMs);
    }

    /**
     * Validates input, updates UI buttons/banner for optimistic feedback, and posts 
     * the time card payload asynchronously to Google Apps Script backend.
     * @param {boolean} isClockIn - True for Clock-In action; False for Clock-Out action.
     */
    async function processPunch(isClockIn) {
      // Input Validation: Check for empty PIN
      if (!currentPin.trim()) {
        showStatus("Please enter your PIN ID first.", "#ff8c00"); // Dark Orange
        return;
      }

      // Disable buttons to prevent double-submit network bugs
      const btnIn = document.getElementById("btnIn");
      const btnOut = document.getElementById("btnOut");
      btnIn.disabled = true;
      btnOut.disabled = true;

      // Optimistic UI: Immediate visual feedback while network call processes
      showStatus("Processing request...", "#000080"); // Navy Blue

      const actionText = isClockIn ? "Clock-In" : "Clock-Out";
      const payload = {
        apiKey: CONFIG.apiSecret,
        pin: currentPin,
        action: actionText
      };

      try {
        // Fetch POST request (text/plain avoids browser CORS preflight checks in Apps Script)
        const response = await fetch(CONFIG.webAppUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        // Handle backend status responses
        if (result && result.status === "SUCCESS") {
          const empName = result.employeeName || "Employee";
          const actionSuccess = isClockIn ? "Clocked-In" : "Clocked-Out";
          const time = result.time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          showStatus(`${empName} ${actionSuccess}!\nTime: ${time}`, "#008000"); // Dark Green
        } else if (result && result.status === "ALREADY_CLOCKED_IN") {
          showStatus("Employee Already Clocked-in.", "#ff8c00");
        } else if (result && result.status === "NOT_CLOCKED_IN") {
          showStatus("Employee is Not Clocked-in.", "#ff8c00");
        } else if (result && result.status === "INVALID_PIN") {
          showStatus("Invalid or Inactive PIN.", "#b22222"); // Dark Red
        } else {
          showStatus("Error processing request.", "#b22222");
        }
      } catch (err) {
        showStatus("Network Connection Error.", "#b22222");
      } finally {
        // Re-enable interface buttons and clear input buffer
        btnIn.disabled = false;
        btnOut.disabled = false;
        resetPinInput();
      }
    }
  </script>
</body>
</html>
